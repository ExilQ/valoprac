name: Publish VALOPRAC release
# Every version that has Korean patch notes in docs/releases/v12.N.md (first
# line "# <release title>") and no GitHub Release yet is released when a
# branch push to production or a claude/ branch carries those notes. The tag
# v12.N is created on the last commit whose package.json says 12.0.N and that
# contains the notes; that exact commit is validated, its browser + Unreal
# staging source archive is packaged, and the release is published.
#
# Requires the repository secret RELEASE_TOKEN: a fine-grained token for this
# repository only, with Contents and Workflows read/write. GitHub refuses to
# let the built-in GITHUB_TOKEN create a tag on a commit that carries a
# workflow file the default branch does not have, which every commit on this
# line does (this file).
on:
  push:
    branches: [production, 'claude/**']
    paths: ['docs/releases/v*.md', '.github/workflows/release.yml']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Find versions to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_of(){ local tag=$1 core=${1#v} a b c; IFS=. read -r a b c <<<"$core"; if [ -n "${c:-}" ]; then echo "$a.$b.$c"; else echo "$a.0.$b"; fi; }
          released=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')
          entries=()
          if true; then
            for notes in $(ls docs/releases/v*.md 2>/dev/null | sort -V); do
              tag=$(basename "$notes" .md)
              if grep -qxF "$tag" <<<"$released"; then continue; fi
              want=$(package_of "$tag") sha=""
              for c in $(git rev-list -n 400 HEAD); do
                git cat-file -e "$c:$notes" 2>/dev/null || continue
                [ "$(git show "$c:package.json" | jq -r .version)" = "$want" ] && { sha=$c; break; }
              done
              if [ -z "$sha" ]; then echo "::warning::No commit with package $want and $notes; skipping $tag"; continue; fi
              entries+=("$tag $sha")
            done
          fi
          newest=$( { printf '%s\n' $released; for e in "${entries[@]}"; do echo "${e%% *}"; done; } | grep -E '^v[0-9]' | sort -V | tail -n1 )
          json=$(for e in "${entries[@]}"; do tag=${e%% *} sha=${e##* }; jq -nc --arg tag "$tag" --arg sha "$sha" --argjson latest "$([ "$tag" = "$newest" ] && echo true || echo false)" '{tag:$tag,sha:$sha,latest:$latest}'; done | jq -sc .)
          echo "Planned: $json"
          echo "versions=$json" >> "$GITHUB_OUTPUT"
  release:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.versions) }}
    env:
      TAG: ${{ matrix.tag }}
      TARGET: ${{ matrix.sha }}
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - name: Require the release token
        run: |
          if [ "$HAS_RELEASE_TOKEN" != true ]; then
            echo "::error::Add the RELEASE_TOKEN repository secret (fine-grained token, this repository only, Contents + Workflows read/write). GITHUB_TOKEN cannot create tags on commits that add workflow files."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
      - name: Check tag, package version and patch notes
        id: meta
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<<"${TAG#v}"
          if [ -n "${patch:-}" ]; then expected="$major.$minor.$patch"; else expected="$major.0.$minor"; fi
          [ "$version" = "$expected" ] || { echo "::error::$TAG expects package $expected but package.json is $version"; exit 1; }
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::Missing $notes"; exit 1; }
          title=$(head -n1 "$notes" | sed 's/^# *//')
          [ -n "$title" ] || { echo "::error::$notes must start with '# <title>'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile
      - name: Application tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Broker and hosting tests
        run: pnpm test:broker && pnpm test:hosting
      # The full `pnpm build` chain also runs verify-build, verify-modern-web
      # and verify-search, which read QA comparison images and
      # deployment/search-discovery.json that are not tracked in Git. Run the
      # build stages that only need tracked sources.
      - name: Build browser bundle and package source
        run: |
          set -euo pipefail
          node scripts/sync-interface-tokens.mjs
          node scripts/validate-release.mjs
          node scripts/package-unreal.mjs
          pnpm exec vite build
          node --test scripts/interface-palette.test.mjs
          node scripts/verify-interface-palette.mjs
          node scripts/export-routes.mjs
      - name: Prepare release asset and notes
        id: asset
        run: |
          set -euo pipefail
          asset="valoprac-v${{ steps.meta.outputs.version }}-unreal-source.zip"
          cp public/downloads/valoprac-unreal-source.zip "$asset"
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          tail -n +2 "docs/releases/$TAG.md" > release-notes.md
          {
            echo
            echo "## 내려받기"
            echo
            echo "- \`$asset\` · 이 버전의 브라우저 + Unreal Engine 5.7 스테이징 소스"
            echo "- SHA-256 \`$sha\`"
            echo
            echo "릴리스 자동 검증: 커밋 \`${TARGET::7}\`에서 테스트·타입 검사·broker/hosting 테스트·번들 빌드를 실행했습니다."
          } >> release-notes.md
          echo "file=$asset" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TITLE: ${{ steps.meta.outputs.title }}
          ASSET: ${{ steps.asset.outputs.file }}
          LATEST: ${{ matrix.latest }}
        run: |
          set -euo pipefail
          retry(){ for attempt in 1 2 3; do "$@" && return 0; echo "::warning::Attempt $attempt failed: $1 $2"; sleep $((attempt*20)); done; return 1; }
          # Create the tag with git first so the release call only references
          # an existing tag; a tag pushed with this token does not start a run.
          remote=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$remote" ]; then
            git tag "$TAG" "$TARGET"
            retry git push origin "refs/tags/$TAG"
          else
            peeled=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
            [ "${peeled:-$remote}" = "$TARGET" ] || { echo "::error::$TAG already points to ${peeled:-$remote}, not $TARGET"; exit 1; }
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file release-notes.md --latest="$LATEST"
            retry gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            retry gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --verify-tag --latest="$LATEST" --title "$TITLE" --notes-file release-notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '"Published \(.url) with \(.assets|length) asset(s)"'

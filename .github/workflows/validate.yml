name: Validate production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Enable locked pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Test browser runtime
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Test broker and migration guard
        run: pnpm test:broker && pnpm verify:migration
      - name: Build browser artifact
        run: pnpm build
      - name: Preserve the exact release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valoprac-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 14
